<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% include head-custom.html %}
  <title>{% if page.title and page.url != "/" %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/github-markdown.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/kb.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ '/wiki/' | relative_url }}">Wiki</a>
      <a href="{{ '/src/meetings/' | relative_url }}">會議記錄</a>
      <a href="https://github.com/cofacts/kb">GitHub</a>
    </nav>
  </header>
  <main class="markdown-body">
    {{ content }}
  </main>
  <script>
  // Render GitHub-style alerts: > [!NOTE] / [!TIP] / [!IMPORTANT] / [!WARNING] / [!CAUTION]
  document.querySelectorAll('.markdown-body blockquote').forEach(function (bq) {
    var p = bq.querySelector(':scope > p');
    if (!p || !p.firstChild || p.firstChild.nodeType !== 3) return;
    var m = p.firstChild.nodeValue.match(/^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*/i);
    if (!m) return;
    var type = m[1].toLowerCase();
    p.firstChild.nodeValue = p.firstChild.nodeValue.slice(m[0].length);
    bq.classList.add('markdown-alert', 'markdown-alert-' + type);
    var title = document.createElement('p');
    title.className = 'markdown-alert-title';
    title.textContent = type.charAt(0).toUpperCase() + type.slice(1);
    bq.insertBefore(title, bq.firstChild);
  });
  </script>
</body>
</html>
